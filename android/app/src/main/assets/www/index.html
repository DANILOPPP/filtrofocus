<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>FiltroFocus - Bloqueador</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">
<style>
:root{--bg:#0a0a0a;--card:#18181b;--border:#27272a;--accent:#8b5cf6;--text:#fafafa;--muted:#a1a1aa}
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
.header{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;background:rgba(10,10,10,.9);backdrop-filter:blur(12px);z-index:10}
.logo{width:36px;height:36px;background:var(--accent);border-radius:10px;display:grid;place-items:center;font-weight:900}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#27272a;border:1px solid #3f3f46;border-radius:999px;padding:6px 12px;margin:4px;font-size:13px}
.chip button{background:none;border:none;color:var(--muted);cursor:pointer}
.input-row{display:flex;gap:8px;margin-top:8px}
input{flex:1;background:#09090b;border:1px solid var(--border);border-radius:12px;padding:12px;color:white;outline:none}
.btn{background:var(--accent);color:white;border:none;border-radius:12px;padding:12px 16px;font-weight:700}
.toggle{width:44px;height:26px;background:#27272a;border-radius:999px;position:relative;transition:.2s}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;background:white;border-radius:50%;transition:.2s}
.toggle.on::after{left:20px}
.feed-item{border-left:3px solid var(--border);padding:12px;margin:8px 0;background:#111113;border-radius:12px}
.feed-item.blocked{opacity:.5;border-left-color:#ef4444;filter:blur(1px)}
.badge{font-size:10px;font-weight:800;padding:4px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.badge-block{background:#ef444422;color:#ef4444;border:1px solid #ef444455}
.badge-ok{background:#22c55e22;color:#22c55e;border:1px solid #22c55e55}
</style>
</head>
<body>
<div class="header">
<div class="logo">F</div>
<div><div style="font-weight:800;font-size:18px">FiltroFocus</div><div style="font-size:12px;color:var(--muted)">Sua mente, suas regras</div></div>
<div style="margin-left:auto" id="counter" class="badge badge-ok">0 bloqueados</div>
</div>

<div id="app" style="max-width:600px;margin:0 auto;padding-bottom:80px"></div>

<script>
const DEFAULT_NEWS=[
{t:"Virgínia Fonseca lança base nova e web vai à loucura",s:"Gossip Brasil",cat:"personalidades"},
{t:"Neymar é flagrado em festa em São Paulo",s:"Léo Dias",cat:"personalidades"},
{t:"Top 10 sertanejo universitário que não sai da cabeça",s:"Spotify News",cat:"musica"},
{t:"Como focar no trabalho sem distrações em 2026",s:"Você",cat:"produtivo"},
{t:"Anitta anuncia parceria com K-pop",s:"POPline",cat:"musica"},
{t:"Signo de hoje: seu ex vai voltar",s:"Astrologia",cat:"aleatorio"},
{t:"Guia prático: criar app sem código",s:"Tecnologia",cat:"produtivo"},
{t:"Treta do BBB: quem você odeia hoje?",s:"BBB",cat:"aleatorio"},
{t:"Funk proibidão domina TikTok",s:"TikTok Trends",cat:"musica"},
{t:"Como limpar seu feed e ganhar 2h por dia",s:"FiltroFocus",cat:"produtivo"}
];

let blocks = JSON.parse(localStorage.getItem('ff_blocks')||'{"personalidades":["virgínia","neymar","anitta","kardashian"],"musica":["sertanejo","funk proibidão","k-pop"],"aleatorio":["bbb","astrologia","fofoca"],"custom":[]}');
let toggles = JSON.parse(localStorage.getItem('ff_toggles')||'{"personalidades":true,"musica":true,"aleatorio":true}');

function save(){localStorage.setItem('ff_blocks',JSON.stringify(blocks));localStorage.setItem('ff_toggles',JSON.stringify(toggles)); render();}

function isBlocked(item){
 const title=item.t.toLowerCase();
 const all=[...blocks.personalidades,...blocks.musica,...blocks.aleatorio,...blocks.custom].map(x=>x.toLowerCase());
 if(all.some(k=>k && title.includes(k))){
   if(toggles[item.cat]!==false || item.cat==='aleatorio' && all.some(k=>title.includes(k))) return true;
   if(item.cat!=='produtivo' && all.some(k=>title.includes(k))) return true;
 }
 // check category toggle + blocked terms in that cat
 if(toggles.personalidades && blocks.personalidades.some(k=>title.includes(k.toLowerCase()))) return true;
 if(toggles.musica && blocks.musica.some(k=>title.includes(k.toLowerCase()))) return true;
 if(toggles.aleatorio && blocks.aleatorio.some(k=>title.includes(k.toLowerCase()))) return true;
 if(blocks.custom.some(k=>title.includes(k.toLowerCase()))) return true;
 return false;
}

function render(){
 const app=document.getElementById('app');
 let blockedCount=0;
 app.innerHTML=`
 <div class="card"><h3 style="margin:0 0 12px">🛡️ Personalidades <div style="float:right" class="toggle ${toggles.personalidades?'on':''}" onclick="toggles.personalidades=!toggles.personalidades;save()"></div></h3>
 <div id="chips-p">${blocks.personalidades.map((c,i)=>`<span class="chip">${c} <button onclick="blocks.personalidades.splice(${i},1);save()">×</button></span>`).join('')}</div>
 <div class="input-row"><input id="in-p" placeholder="Adicionar personalidade..."><button class="btn" onclick="if(document.getElementById('in-p').value){blocks.personalidades.push(document.getElementById('in-p').value);save()}">+</button></div></div>

 <div class="card"><h3 style="margin:0 0 12px">🎵 Estilos Musicais <div style="float:right" class="toggle ${toggles.musica?'on':''}" onclick="toggles.musica=!toggles.musica;save()"></div></h3>
 <div>${blocks.musica.map((c,i)=>`<span class="chip">${c} <button onclick="blocks.musica.splice(${i},1);save()">×</button></span>`).join('')}</div>
 <div class="input-row"><input id="in-m" placeholder="Ex: pagode, trap..."><button class="btn" onclick="if(document.getElementById('in-m').value){blocks.musica.push(document.getElementById('in-m').value);save()}">+</button></div></div>

 <div class="card"><h3 style="margin:0 0 12px">🎲 Conteúdo Aleatório <div style="float:right" class="toggle ${toggles.aleatorio?'on':''}" onclick="toggles.aleatorio=!toggles.aleatorio;save()"></div></h3>
 <div>${blocks.aleatorio.map((c,i)=>`<span class="chip">${c} <button onclick="blocks.aleatorio.splice(${i},1);save()">×</button></span>`).join('')}</div>
 <div class="input-row"><input id="in-a" placeholder="Ex: política, futebol..."><button class="btn" onclick="if(document.getElementById('in-a').value){blocks.aleatorio.push(document.getElementById('in-a').value);save()}">+</button></div>
 <div style="margin-top:12px"><div style="font-size:12px;color:#a1a1aa;margin-bottom:6px">Palavras custom:</div><div>${blocks.custom.map((c,i)=>`<span class="chip" style="border-color:#8b5cf6">${c} <button onclick="blocks.custom.splice(${i},1);save()">×</button></span>`).join('')||'<span style="color:#52525b;font-size:12px">Nenhuma ainda</span>'}</div>
 <div class="input-row"><input id="in-c" placeholder="Qualquer palavra..."><button class="btn" onclick="if(document.getElementById('in-c').value){blocks.custom.push(document.getElementById('in-c').value);save()}">+</button></div></div></div>

 <div class="card"><h3>📰 Feed Filtrado - Preview</h3><div id="feed"></div></div>
 `;

 const feedEl=document.getElementById('feed');
 DEFAULT_NEWS.forEach(n=>{
   const blocked=isBlocked(n);
   if(blocked) blockedCount++;
   feedEl.innerHTML+=`<div class="feed-item ${blocked?'blocked':''}"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:11px;color:#a1a1aa">${n.s} • ${n.cat}</span><span class="badge ${blocked?'badge-block':'badge-ok'}">${blocked?'Bloqueado':'Permitido'}</span></div><div style="font-weight:600">${n.t}</div></div>`;
 });
 document.getElementById('counter').textContent=blockedCount+' bloqueados';
}
render();
</script>
</body>
</html>
