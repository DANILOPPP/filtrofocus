
plugins { id 'com.android.application' }
android {
    namespace 'com.filtrofocus.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.filtrofocus.app"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "3.0-Android14-FIXED"
    }
    buildTypes {
        release { minifyEnabled false }
        debug { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
