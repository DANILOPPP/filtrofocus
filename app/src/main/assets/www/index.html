<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>FiltroFocus</title>
<style>body{margin:0;font-family:sans-serif;background:#000;color:#fff;padding:16px}.card{background:#111;border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid #222}input{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#000;color:#fff}button{width:100%;padding:12px;border-radius:10px;border:none;font-weight:bold;margin-top:8px;background:#ff0033;color:#fff}.tag{display:inline-block;background:#222;padding:6px 10px;border-radius:20px;margin:4px}.perm{padding:10px;border-radius:8px;background:#ffaa00;color:#000;text-align:center;font-weight:bold}.perm.ok{background:#00ff88}.onoff{padding:14px;border-radius:10px;background:#7c3aed;color:#fff;text-align:center;font-weight:bold}.off{background:#333}.small{opacity:.6;font-size:12px}</style>
</head><body>
<div class="card" style="background:#ff0033"><h2>🚫 FiltroFocus V16.2</h2><div>BLOQUEADOR REAL - Lista vazia</div></div>
<div class="card"><div id="status" class="onoff off" onclick="toggle()">DESATIVADO</div></div>
<div class="card"><div id="pA" class="perm" onclick="reqA()">ATIVAR ACESSIBILIDADE</div></div>
<div class="card"><input id="kw" placeholder="Ex: Anitta"><button onclick="add()">BLOQUEAR PALAVRA</button><div id="list" style="margin-top:10px"></div><button style="background:#222" onclick="clearAll()">Limpar</button><button style="background:#111;border:1px solid #333" onclick="test()">Testar</button></div>
<script>
function get(){try{if(window.Android)return JSON.parse(Android.getK());return JSON.parse(localStorage.getItem('ff')||'[]')}catch(e){return []}}
function save(a){if(window.Android)Android.setK(JSON.stringify(a));else localStorage.setItem('ff',JSON.stringify(a));render()}
function render(){var k=get();var el=document.getElementById('list');if(k.length==0){el.innerHTML='<div style="opacity:.5;text-align:center;border:1px dashed #333;padding:10px">Lista vazia</div>';return}el.innerHTML=k.map((x,i)=>'<span class=tag>'+x+' <b onclick="rem('+i+')" style="color:red">x</b></span>').join('');upd()}
function add(){var v=document.getElementById('kw').value.trim();if(!v)return;var k=get();if(k.map(s=>s.toUpperCase()).indexOf(v.toUpperCase())==-1){k.push(v);save(k);if(window.Android)Android.add(v);}document.getElementById('kw').value='';}
function rem(i){var k=get();var r=k[i];k.splice(i,1);save(k);if(window.Android)Android.rem(r);}
function clearAll(){save([]);if(window.Android)Android.setK('[]');}
function test(){if(window.Android)Android.testBlock();}
function toggle(){if(window.Android)Android.toggleMaster();upd();}
function reqA(){if(window.Android)Android.reqAcc();}
function upd(){if(!window.Android)return;var on=Android.isOn();document.getElementById('status').innerText=on?'BLOQUEIO ATIVADO':'DESATIVADO';document.getElementById('status').className=on?'onoff':'onoff off';var ok=Android.hasAcc();document.getElementById('pA').className=ok?'perm ok':'perm';document.getElementById('pA').innerText=ok?'✅ ATIVA':'ATIVAR ACESSIBILIDADE';}
setInterval(upd,1000);render();upd();
</script></body></html>
