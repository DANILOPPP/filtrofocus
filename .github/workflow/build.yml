YAML
name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: 8.7}
      - name: Build
        run: |
          ls -la
          find . -name "gradlew" -type f
          if [ -f "android/gradlew" ]; then cd android && chmod +x gradlew && ./gradlew assembleDebug --stacktrace
          elif [ -f "gradlew" ]; then chmod +x gradlew && ./gradlew assembleDebug --stacktrace
          else echo "ERRO"; find . -name "*.gradle"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: FiltroFocus-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
